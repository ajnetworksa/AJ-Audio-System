# AJ Music Assistant – Home Assistant add-on (install: server/ha-addon/README.md).
# Same image and settings as the official Music Assistant add-on (HA login, sidebar panel, discovery),
# plus our providers (AJ Snap for the wall panels) baked in at build time.
name: AJ Music Assistant
version: "2.10.9-aj4"
slug: aj_music_assistant
description: Music Assistant 2.10.9 + AJ plugins (AJ Snap for the wall panels, AJ Cast for phone/panel sharing)
url: https://github.com/ajnetworksa/AJ-Audio-System
arch:
  - aarch64
  - amd64
homeassistant_api: true
hassio_api: true
hassio_role: manager
discovery:
  - music_assistant
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
audio: true
panel_icon: mdi:music-assistant
panel_title: AJ Music Assistant
panel_admin: false
uart: false
apparmor: true
map:
  - media:rw
  - ssl:ro
  - share:rw
init: false
startup: application
boot: auto
webui: "http://[HOST]:[PORT:8095]"
backup_exclude:
  - cache.db
  - collage_images/*
  - .cache/*
  - library.db.backup
stage: experimental
tmpfs: true
options:
  log_level: info
  safe_mode: false
schema:
  log_level: list(debug|info|warning|error)
  safe_mode: bool
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
