name: phone-flutter
on:
  push:
    paths: ["apps/phone-flutter/**", ".github/workflows/phone-flutter.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/phone-flutter

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate platform folder
        run: flutter create --org com.ajnetwork --project-name aj_audio --platforms android .
      - name: Network permissions (LAN http to Music Assistant)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          grep -q usesCleartextTraffic $M || sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M
          sed -i 's#android:label="aj_audio"#android:label="AJ Audio"#' $M
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk AJ_Audio.apk
      - uses: actions/upload-artifact@v4
        with: { name: aj-audio-apk, path: apps/phone-flutter/AJ_Audio.apk }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate platform folder
        run: flutter create --org com.ajnetwork --project-name aj_audio --platforms ios .
      - name: Info.plist (LAN http, local network, name)
        run: |
          P=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" $P || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" $P || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'AJ Audio talks to your Music Assistant server and wall panels.'" $P || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" $P || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string _mass._tcp" $P || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'AJ Audio'" $P || true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA (sign with Sideloadly / AltStore)
        run: |
          mkdir -p Payload && cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr AJ_Audio.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: aj-audio-ipa-unsigned, path: apps/phone-flutter/AJ_Audio.ipa }
