name: android-java
# Builds the Java apps (AJ Panel, AJ Audio v0.1, ControlX Bridge) with the same Gradle-free toolchain as tools/build_java_apk.sh
on:
  push:
    paths: ["apps/panel/**", "apps/phone-android/**", "legacy/controlx-bridge/**", "tools/build_java_apk.sh", ".github/workflows/android-java.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: uber-apk-signer
        run: curl -sL -o /tmp/uas.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
      - name: Build
        env:
          SDK: ${{ env.ANDROID_SDK_ROOT }}
          AAPT2: ${{ env.ANDROID_SDK_ROOT }}/build-tools/35.0.0/aapt2
          UAS: /tmp/uas.jar
        run: |
          bash tools/build_java_apk.sh apps/panel
          bash tools/build_java_apk.sh apps/phone-android
          bash tools/build_java_apk.sh legacy/controlx-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: java-apks
          path: |
            apps/panel/build/*.apk
            apps/phone-android/build/*.apk
            legacy/controlx-bridge/build/*.apk
