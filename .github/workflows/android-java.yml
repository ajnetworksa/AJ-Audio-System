name: android-java
# Builds the Java apps (AJ Panel, AJ Zigbee Survey) with tools/build_java_apk.sh (no Gradle).
# Signing: if the repo secrets ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PASS exist -> release key, else debug key.
on:
  pull_request:         # check PRs; pushes to main are built by release.yml
  workflow_dispatch:
  workflow_call:        # used by release.yml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      # the ubuntu runner already has the Android SDK in $ANDROID_HOME; just make sure platform/build-tools 35 are there
      - name: Android SDK packages
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms/android-35/android.jar" "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar"
      - name: uber-apk-signer (debug-key fallback)
        run: curl -sSL -o "$RUNNER_TEMP/uas.jar" https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
      - name: Release key from secrets (optional)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; echo "release key: yes"; else echo "release key: no (debug key)"; fi
      - name: Zigbee survey – radio protocol tests (simulated EZSP v7/v13 + ZNP sticks)
        run: |
          mkdir -p "$RUNNER_TEMP/zt"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/zt" apps/zigbee-survey/src/com/ajnetwork/ajzigbee/radio/*.java apps/zigbee-survey/test/RadioTest.java
          java -cp "$RUNNER_TEMP/zt" RadioTest
      - name: AJ Panel – Home Assistant client + dashboard tests (mock HA over WebSocket)
        run: |
          mkdir -p "$RUNNER_TEMP/pt"; S=apps/panel/src/com/ajnetwork/ajpanel
          javac -encoding UTF-8 -d "$RUNNER_TEMP/pt" $(find apps/panel/test/stub -name '*.java') $S/Ws.java $S/Ha.java $S/Dash.java $S/Skin.java $S/Lang.java apps/panel/test/HaTest.java
          java -cp "$RUNNER_TEMP/pt" com.ajnetwork.ajpanel.HaTest
      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          export SDK="$ANDROID_HOME" AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2" UAS="$RUNNER_TEMP/uas.jar"
          bash tools/build_java_apk.sh apps/panel
          bash tools/build_java_apk.sh apps/zigbee-survey
      - uses: actions/upload-artifact@v4
        with:
          name: java-apks
          # only the finished, signed apps (build/ also holds base.apk / unsigned.apk intermediates)
          path: |
            apps/panel/build/*_v*.apk
            apps/zigbee-survey/build/*_v*.apk
